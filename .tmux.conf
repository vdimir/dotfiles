# Single tmux config for macOS and dev servers.
# Deploy remote: scp ~/dotfiles/.tmux.conf <host>:~/.tmux.conf

unbind C-b
set -g prefix C-a
bind C-a send-prefix

set -g default-terminal "tmux-256color"
# Outer terminals reporting xterm-256color (VS Code, iTerm2) do support RGB;
# without this tmux quantizes truecolor to the 256 palette
set -as terminal-features ",xterm-256color:RGB"

set -g mouse on
set -g history-limit 50000
set -g remain-on-exit off
set-option -g default-shell $SHELL

# Refresh the VS Code IPC socket in the session env on client attach
set -ag update-environment "VSCODE_IPC_HOOK_CLI"

# Terminal tab title = active pane's title when an app overrides it (e.g.
# Claude Code publishes its status via OSC), with the session name in parens.
# sdev matches tabs by the "(title )?(session-name)" shape — keep in sync.
set -g set-titles on
set -g set-titles-string "#{?#{!=:#{pane_title},#{host}},#{=/40/…:pane_title} (#S),#S}"
set-window-option -g automatic-rename on

# New windows/splits open in the current pane directory
bind c new-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

# vi copy mode; copies reach the local clipboard via OSC 52, so this works
# over ssh without pbcopy/xclip
set-window-option -g mode-keys vi
set -g set-clipboard on
setw -g word-separators ' @"=()[]\_-:./,'
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection
bind -n DoubleClick1Pane select-pane \; copy-mode -M \; send-keys -X select-word \; send-keys -X copy-selection
bind -T copy-mode-vi DoubleClick1Pane select-pane \; send-keys -X select-word \; send-keys -X copy-selection
bind -n TripleClick1Pane select-pane \; copy-mode -M \; send-keys -X select-line \; send-keys -X copy-selection
bind -T copy-mode-vi TripleClick1Pane select-pane \; send-keys -X select-line \; send-keys -X copy-selection

# Pane navigation / resize
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -n C-Up resize-pane -U 10
bind -n C-Down resize-pane -D 10
bind -n C-Left resize-pane -L 10
bind -n C-Right resize-pane -R 10

bind r source-file ~/.tmux.conf

# Quiet: no visual/audible activity noise
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
set-window-option -g monitor-activity off
set -g bell-action none

######################
### DESIGN CHANGES ###
######################

set -g clock-mode-colour colour135
set -g mode-style bg=colour238,fg=colour196,bold

set -g pane-border-style bg=colour235,fg=colour238
set -g pane-active-border-style bg=colour236,fg=colour8

set -g status-justify left
set -g status-interval 2
set -g status-position bottom
set -g status-style bg=colour234,fg=colour137,dim
set -g status-left ''
set -g status-left-length 60
set -g status-right '#[fg=colour233,bg=colour241,bold] #S '
set -g status-right-length 60

set-window-option -g window-status-current-style bg=colour238,fg=colour81,bold
set-window-option -g window-status-current-format ' #I#[fg=colour250]:#[fg=colour255]#W#[fg=colour50]#F '
set-window-option -g window-status-style bg=colour235,fg=colour138,none
set-window-option -g window-status-format ' #I#[fg=colour237]:#[fg=colour250]#W#[fg=colour244]#F '
set-window-option -g window-status-bell-style fg=colour255,bg=colour1,bold

set -g message-style fg=colour232,bg=colour166,bold

# Machine-specific overrides, not tracked in dotfiles
source-file -q ~/.tmux.local.conf
